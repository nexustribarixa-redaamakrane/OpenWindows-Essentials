# ==============================================================================
# OpenWindows Master Run Control Configuration (rc.conf)
# NT-like system run control and service daemon orchestration
# ==============================================================================

# -- System Root & Platform Paths ----------------------------------------------
SYSTEM_ROOT="C:\OpenWindows"
SYSTEM_DRIVE="C:"
VIP_SYSTEM_VOLUME="VIP0:"
SYSTEM_CONFIG="C:\OpenWindows\Config"
SYSTEM_LOGS="C:\OpenWindows\Logs"
SYSTEM_TEMP="C:\OpenWindows\Temp"

# -- General System Settings ---------------------------------------------------
HOSTNAME="OpenWindows-PC"
DEFAULT_RUNLEVEL=5
TIMEZONE="UTC"
CONSOLE_FONT="C:\OpenWindows\Fonts\default.suf"
KEYMAP="us_qwerty"
VERBOSE_BOOT="yes"

# -- Filesystems & VIP Storage -------------------------------------------------
MOUNT_SYSTEM_RW="yes"
CHECK_VOLUME_INTEGRITY="yes"
RAMDISK_TEMP_SIZE="32M"
VIP_AUTO_INDEX="yes"
ROOT_FILESYSTEM="OWFS"

# -- Network Configuration -----------------------------------------------------
NETWORK_ENABLED="yes"
PRIMARY_ADAPTER="\Device\Network\eth0"
DHCP_AUTO="yes"
FIREWALL_ENABLED="yes"
DNS_SERVERS="8.8.8.8,8.8.4.4"

# -- Sound & Audio -------------------------------------------------------------
AUDIO_ENABLED="yes"
DEFAULT_VOLUME="75"

# -- Graphical Environment ----------------------------------------------------
GUI_AUTOLOCK="no"
DEFAULT_WM="C:\OpenWindows\Software\startwm.owx"
DEFAULT_THEME="dark"
DISPLAY_RESOLUTION="1920x1080x32"

# -- Active Daemons / Services -------------------------------------------------
# Daemons started in order during multi-user and GUI runlevels:
DAEMONS="syslog devmgr kconf storage network firewall audio banhammer sentinel cron gui"
