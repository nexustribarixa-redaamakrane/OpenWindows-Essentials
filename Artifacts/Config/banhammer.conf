# BANHammer Configuration
# Controls crash screen behavior and recovery

[display]
text_color = 0xFFFFFF
bg_color = 0x1A0A2E
accent_color = 0xFF6B6B
font_size = 16
show_technical = true
show_qr_code = false
animation_enabled = true

[recovery]
auto_restart = false
auto_restart_delay = 30
dump_memory = true
dump_path = C:\OpenWindows\CrashDumps\
max_dumps = 10
sentinel_enabled = true

[reporting]
log_to_disk = true
log_path = C:\OpenWindows\Logs\banhammer.log
max_log_size = 1048576
verbose = false

[sounds]
crash_beep = true
beep_frequency = 440
beep_duration = 500
