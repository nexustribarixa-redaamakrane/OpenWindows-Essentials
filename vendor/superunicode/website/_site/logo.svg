<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SuperUnicode logo">
  <defs>
    <linearGradient id="suGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB066" stop-opacity=".95"/>
      <stop offset="1" stop-color="#C084FC" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="58" fill="url(#suGrad)"/>

  <!-- Codepoint-cell grid (4 cells, lower-left) hinting at the SCP registry -->
  <g>
    <rect x="34" y="178" width="34" height="34" rx="8" fill="url(#cellGrad)"/>
    <rect x="76" y="178" width="34" height="34" rx="8" fill="url(#cellGrad)" opacity=".75"/>
    <rect x="34" y="136" width="34" height="34" rx="8" fill="url(#cellGrad)" opacity=".55"/>
  </g>

  <!-- Wordmark -->
  <text x="196" y="150" font-family="'Noto Sans', 'Segoe UI', Arial, sans-serif"
        font-size="108" font-weight="900" fill="#ffffff" text-anchor="middle">SU</text>

  <!-- Sentinel accent -->
  <circle cx="204" cy="176" r="8" fill="#ffffff" opacity=".9"/>
</svg>
