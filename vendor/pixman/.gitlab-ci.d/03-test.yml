# Test stage
#
# This stage executes the test suite for pixman for all architectures in
# different configurations. Build and test is split, as some architectures can
# have different QEMU configuration or have multiple supported pixman backends,
# which are executed as job matrix.
#
# Mind that `PIXMAN_ENABLE` variable in matrix runs does nothing, but it looks
# better in CI to indicate what is actually being tested.
#
# Some emulated targets are really slow or cannot be run in multithreaded mode
# (mipsel, arm-v5). Thus coverage reporting is disabled for them.
spec:
  inputs:
    active_target_pattern:
    runner_tag_amd64:
    runner_tag_qemu:
    runner_tag_arm64:
---

variables:
  # Used in summary stage as well.
  COVERAGE_BASE_DIR: coverage
  COVERAGE_OUT: ${COVERAGE_BASE_DIR}/${CI_JOB_ID}
  TEST_NAME: ""  # Allow to specify a set of tests to run with run variables.

# File patterns that, when changed, should trigger every target's build/test
# jobs, regardless of architecture. Kept in sync with the equivalent anchors
# in 02-build.yml.
.common-changed-paths: &common-changed-paths
  - .gitlab-ci.d/**/*
  - meson.build
  - meson.options
  - subprojects/**/*
  - test/**/*
  - demos/**/*
  - pixman/pixman.c
  - pixman/pixman-access.c
  - pixman/pixman-access-accessors.c
  - pixman/pixman-accessor.h
  - pixman/pixman-bits-image.c
  - pixman/pixman-combine32.c
  - pixman/pixman-combine32.h
  - pixman/pixman-combine-float.c
  - pixman/pixman-combine-float.h
  - pixman/pixman-compiler.h
  - pixman/pixman-conical-gradient.c
  - pixman/pixman-edge.c
  - pixman/pixman-edge-accessors.c
  - pixman/pixman-edge-imp.h
  - pixman/pixman-fast-path.c
  - pixman/pixman-filter.c
  - pixman/pixman-general.c
  - pixman/pixman-glyph.c
  - pixman/pixman-gradient-walker.c
  - pixman/pixman.h
  - pixman/pixman-image.c
  - pixman/pixman-implementation.c
  - pixman/pixman-inlines.h
  - pixman/pixman-linear-gradient.c
  - pixman/pixman-matrix.c
  - pixman/pixman-noop.c
  - pixman/pixman-private.h
  - pixman/pixman-radial-gradient.c
  - pixman/pixman-region.c
  - pixman/pixman-region16.c
  - pixman/pixman-region32.c
  - pixman/pixman-region64f.c
  - pixman/pixman-solid-fill.c
  - pixman/pixman-timer.c
  - pixman/pixman-trap.c
  - pixman/pixman-utils.c

# Per-architecture file patterns. Kept in sync with 02-build.yml.
.x86-changed-paths: &x86-changed-paths
  - pixman/pixman-x86.c
  - pixman/pixman-mmx.c
  - pixman/pixman-sse2.c
  - pixman/pixman-ssse3.c

.arm-changed-paths: &arm-changed-paths
  - pixman/pixman-arm.c
  - pixman/pixman-arm-common.h
  - pixman/pixman-arm-asm.h
  - pixman/pixman-arm-simd.c
  - pixman/pixman-arm-simd-asm.h
  - pixman/pixman-arm-simd-asm.S
  - pixman/pixman-arm-simd-asm-scaled.S
  - pixman/pixman-arm-neon.c
  - pixman/pixman-arm-neon-asm.h
  - pixman/pixman-arm-neon-asm.S
  - pixman/pixman-arm-neon-asm-bilinear.S
  - pixman/pixman-arma64-neon-asm.h
  - pixman/pixman-arma64-neon-asm.S
  - pixman/pixman-arma64-neon-asm-bilinear.S

.mips-changed-paths: &mips-changed-paths
  - pixman/pixman-mips.c
  - pixman/pixman-mips-dspr2.c
  - pixman/pixman-mips-dspr2.h
  - pixman/pixman-mips-dspr2-asm.h
  - pixman/pixman-mips-dspr2-asm.S
  - pixman/pixman-mips-memcpy-asm.S
  # pixman-mmx.c is shared: it builds MMX on x86 and Loongson MMI on mips.
  - pixman/pixman-mmx.c
  - pixman/loongson-mmintrin.h

.ppc-changed-paths: &ppc-changed-paths
  - pixman/pixman-ppc.c
  - pixman/pixman-vmx.c
  - pixman/pixman-power8.c
  - pixman/pixman-power9.c

.riscv-changed-paths: &riscv-changed-paths
  - pixman/pixman-riscv.c
  - pixman/pixman-rvv.c

include:
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-386
      toolchain: [gnu]  # TODO LLVM issue: https://gitlab.freedesktop.org/pixman/pixman/-/issues/106
      pixman_disable:
        - "sse2 ssse3"  # Testing "mmx"
        - "mmx ssse3"  # Testing "sse2"
        - "mmx sse2"  # Testing "ssse3"
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *x86-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-amd64
      pixman_disable:
        - ""
        - "fast"
        - "wholeops"
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *x86-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-amd64
      # AddressSanitizer and UndefinedBehaviorSanitizer. Meson's test runner
      # makes the first reported error abort the test.
      job_name_suffix: ":sanitize"
      build_job_name_suffix: ":sanitize"
      pixman_disable:
        - ""
        - "fast"
        - "wholeops"
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *x86-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-arm-v5
      toolchain: [gnu]  # TODO: https://gitlab.freedesktop.org/pixman/pixman/-/issues/107
      pixman_disable: ["arm-neon"] # Test only arm-simd.
      timeout: 3h
      test_timeout_multiplier: 40
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *arm-changed-paths
      runner_tag: "$[[ inputs.runner_tag_arm64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-arm-v7
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *arm-changed-paths
      runner_tag: "$[[ inputs.runner_tag_arm64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-arm64-v8
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *arm-changed-paths
      runner_tag: "$[[ inputs.runner_tag_arm64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-mips
      toolchain: [gnu]  # TODO: Add llvm once the build is fixed.
      qemu_cpu: [74Kf]
      job_name_prefix: "."
      job_name_suffix: ":failing"
      allow_failure: true  # Some tests seem to fail.
      retry: 0
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *mips-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-mips64le
      toolchain: [gnu]  # TODO: https://gitlab.freedesktop.org/pixman/pixman/-/issues/108
      qemu_cpu: [Loongson-3A4000]
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *mips-changed-paths
      runner_tag: "$[[ inputs.runner_tag_qemu ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-mipsel
      toolchain: [gnu]  # TODO: Add llvm once the build is fixed.
      qemu_cpu: [74Kf]
      timeout: 2h
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *mips-changed-paths
      runner_tag: "$[[ inputs.runner_tag_qemu ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-ppc
      qemu_cpu: [g4]
      timeout: 2h
      test_timeout_multiplier: 30
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *ppc-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-ppc64
      qemu_cpu: [power9]
      timeout: 2h
      test_timeout_multiplier: 30
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *ppc-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-ppc64le
      qemu_cpu: [power10]
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *ppc-changed-paths
      runner_tag: "$[[ inputs.runner_tag_qemu ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: linux-riscv64
      qemu_cpu:
        # Test on target without RVV (verify no autovectorization).
        - rv64,v=false
        # Test correctness for different VLENs.
        - rv64,v=true,vext_spec=v1.0,vlen=128,elen=64
        - rv64,v=true,vext_spec=v1.0,vlen=256,elen=64
        - rv64,v=true,vext_spec=v1.0,vlen=512,elen=64
        - rv64,v=true,vext_spec=v1.0,vlen=1024,elen=64
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *riscv-changed-paths
      runner_tag: "$[[ inputs.runner_tag_qemu ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: windows-686
      pixman_disable:
        # The same as for linux-386.
        - "sse2 ssse3"
        - "mmx ssse3"
        - "mmx sse2"
      retry: 2
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *x86-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: windows-amd64
      pixman_disable:
        # The same as for linux-amd64.
        - ""
        - "fast"
        - "wholeops"
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *x86-changed-paths
      runner_tag: "$[[ inputs.runner_tag_amd64 ]]"
  - local: .gitlab-ci.d/templates/test.yml
    inputs:
      target: windows-arm64-v8
      toolchain: [llvm]
      active_target_pattern: $[[ inputs.active_target_pattern ]]
      common_changed_paths: *common-changed-paths
      arch_changed_paths: *arm-changed-paths
      runner_tag: "$[[ inputs.runner_tag_arm64 ]]"
      retry: 2
